<!doctype html>
<meta charset="utf-8">
<title>Lesson GCal Sync for Kimini</title>
<style>
  /* ツールバーのポップアップとして開かれる。オプションページから開いたときも同じ見た目になる */
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; width: 340px; margin: 0; padding: 16px; color: #222; line-height: 1.6; font-size: 14px; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .row { margin: 14px 0; }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  input[type=text], input[type=number] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
  .hint { font-size: 12px; color: #666; margin-top: 4px; }
  .note { font-size: 12px; color: #666; margin: 0 0 16px; }
  button { padding: 7px 14px; border-radius: 6px; border: 1px solid #2f9e5f; background: #2f9e5f; color: #fff; font-size: 13px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.secondary { background: #fff; color: #2f9e5f; }
  #status, #importStatus { display: block; margin-top: 6px; font-size: 12px; color: #2f9e5f; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; }
  .checkbox-row label { margin: 0; }
</style>

<h1>Lesson GCal Sync for Kimini</h1>
<p class="note">Kimini英会話の予約をGoogleカレンダーに登録します。<br>Glats Inc.（学研グループ）とは関係のない非公式ツールです。</p>

<div class="row">
  <button id="import">予約済みのレッスンを取り込む</button>
  <span id="importStatus"></span>
  <div class="hint">別のブラウザやスマートフォンで予約した分を取り込みます。</div>
</div>

<hr style="border:none;border-top:1px solid #eee;margin:16px 0">

<div class="row checkbox-row">
  <input type="checkbox" id="enabled">
  <label for="enabled">自動登録を有効にする</label>
</div>

<div class="row">
  <label for="calendarId">登録先のカレンダーID</label>
  <input type="text" id="calendarId" placeholder="primary">
  <div class="hint">既定はメインカレンダー（primary）。別のカレンダーに入れるなら、そのカレンダーIDを指定してください。</div>
</div>

<div class="row">
  <label for="titleTemplate">予定のタイトル</label>
  <input type="text" id="titleTemplate">
  <div class="hint">{teacher} 講師名 / {course} コース名 / {material} 教材名 が使えます。</div>
</div>

<div class="row">
  <label for="reminderMinutes">通知（何分前）</label>
  <input type="number" id="reminderMinutes" min="-1" max="1440">
  <div class="hint">-1 にすると通知を設定しません。</div>
</div>

<div class="row">
  <button id="save">保存</button>
  <button id="connect" class="secondary">Googleアカウントを連携</button>
  <span id="status"></span>
</div>

<div class="row">
  <button id="reset" class="secondary">登録済みの記録を消去</button>
  <div class="hint">拡張機能が「登録済み」と覚えているレッスンの一覧を消します。カレンダー上の予定は消えません。</div>
</div>

<script src="popup.js"></script>
